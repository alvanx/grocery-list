<title>Aisle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one-screen phone app. A fixed header (find-or-add bar, store chips, optional category tabs) sits over one scrolling column of category blocks; on wide screens the column centers at 640px. */
:root{
  --bg:#f4f6f3;
  --surface:#ffffff;
  --ink:#1b231f;
  --muted:#5f6b64;
  --faint:#9aa59e;
  --line:#dfe5e0;
  --accent:#2a7449;
  --accent-ink:#ffffff;
  --accent-soft:#dfeee4;
  --mark:#ffe58f;
  --danger:#b4372e;
  --on-chip:#ffffff;
  --snack-act:#9fe0b6;
  --shadow:0 8px 28px rgba(16,40,28,.20);
  --st0:#c4462e; --st1:#2d68b0; --st2:#a8701a; --st3:#7a4ab5; --st4:#13817f; --st5:#bd3b76;
  --f-ui:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --f-head:"Bricolage Grotesque","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --row:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1a201c; --ink:#e4ebe6; --muted:#9aa79f; --faint:#66726b; --line:#2a332e;
    --accent:#6fc493; --accent-ink:#0d1f14; --accent-soft:#1d3226; --mark:#6b5715; --danger:#f08a7f;
    --on-chip:#111613; --snack-act:#1f6b40; --shadow:0 8px 28px rgba(0,0,0,.55);
    --st0:#f08a6f; --st1:#7fb0f0; --st2:#e2b45c; --st3:#b896ee; --st4:#5fcfc9; --st5:#ee8ab6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a201c; --ink:#e4ebe6; --muted:#9aa79f; --faint:#66726b; --line:#2a332e;
  --accent:#6fc493; --accent-ink:#0d1f14; --accent-soft:#1d3226; --mark:#6b5715; --danger:#f08a7f;
  --on-chip:#111613; --snack-act:#1f6b40; --shadow:0 8px 28px rgba(0,0,0,.55);
  --st0:#f08a6f; --st1:#7fb0f0; --st2:#e2b45c; --st3:#b896ee; --st4:#5fcfc9; --st5:#ee8ab6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.35 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}
#top{flex:none;display:flex;flex-direction:column;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
#top.has-tabs{padding-bottom:0}
.bar{display:flex;align-items:center;gap:2px}
.omni{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;padding:0 4px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:text}
.omni:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.omni-ic{display:grid;color:var(--muted)}
#q{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font:16px var(--f-ui)}
#q::placeholder{color:var(--faint)}
.icon-btn{flex:none;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:none;color:var(--muted)}
.icon-btn.lg{width:42px;height:42px}
.icon-btn.sm{width:30px;height:30px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:700 13.5px/1 var(--f-ui);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.chip .n{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--on-chip)}
.chip.on .dot{background:currentColor}
.chip.on .n{color:inherit;opacity:.8}
.chip.add{gap:4px;padding-left:8px;background:none;border-style:dashed;color:var(--muted)}
.chip-in{width:150px;font-weight:400;border-color:var(--accent);outline:0}

.storebar{display:flex;align-items:center;gap:8px;min-height:30px;font-size:13.5px;color:var(--muted)}
.sb-toggle{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:32px;padding:0;border:0;background:none;color:var(--ink);text-align:left;font-size:13.5px}
.switch{position:relative;flex:none;width:38px;height:22px;border-radius:99px;background:var(--line);transition:background .15s}
.knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sb-toggle[aria-checked="true"] .switch{background:var(--c,var(--accent))}
.sb-toggle[aria-checked="true"] .knob{transform:translateX(16px)}
.sb-input,.cname-in{flex:1;min-width:0;height:36px;border:1px solid var(--accent);border-radius:9px;padding:0 10px;background:var(--surface);color:var(--ink);outline:0}
.sb-input{font:16px var(--f-ui)}
.btn{flex:none;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:700 13.5px var(--f-ui)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.danger{color:var(--danger)!important}

.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:10px;margin-bottom:-1px}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:600 15px/1 var(--f-head);white-space:nowrap}
.tab .n{font:400 12px var(--f-ui);color:var(--faint);font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.drop{background:var(--accent-soft);border-radius:10px 10px 0 0;color:var(--ink)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tabrow{display:flex;align-items:center;gap:4px;margin-bottom:-1px}
.tabrow .tabs{flex:1;min-width:0;margin:0 -16px 0 0;padding-inline:2px 10px}
.seg{flex:none;display:flex;padding:2px;border-radius:9px;background:var(--line)}
.seg button{height:28px;padding:0 9px;border:0;border-radius:7px;background:none;color:var(--muted);font:700 12.5px var(--f-ui)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

.stage{position:relative;flex:1;min-height:0}
#list{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:110px;user-select:none;-webkit-user-select:none}
#list input{user-select:text;-webkit-user-select:text}
#results{position:absolute;inset:0;z-index:5;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 40px;background:var(--bg)}

#cats{display:flex;flex-direction:column;gap:4px;padding-top:2px}
.cat-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:2px;min-height:46px;background:var(--bg)}
.cname{min-width:0;padding:8px 4px;border:0;background:none;text-align:left;font:700 17px/1.15 var(--f-head);color:var(--ink);overflow-wrap:anywhere}
.solo .cname{font-size:20px;padding-left:2px}
.cname-in{font:700 16px var(--f-head)}
.count{flex:none;min-width:22px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font:700 12px/20px var(--f-ui);text-align:center;font-variant-numeric:tabular-nums}
.sp{flex:1}
.fold svg{transition:transform .15s}
.folded .fold svg{transform:rotate(-90deg)}
.folded .cat-b{display:none}

.items{display:flex;flex-direction:column;min-height:6px}
.item{display:flex;align-items:center;min-height:var(--row);border-radius:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.grip{flex:none;display:grid;place-items:center;width:28px;align-self:stretch;min-height:var(--row);color:var(--faint);touch-action:none;cursor:grab}
.check{flex:none;display:grid;place-items:center;width:38px;height:42px;padding:0;border:0;background:none}
.box{display:grid;place-items:center;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;color:var(--accent-ink);transition:background .15s,border-color .15s}
.box svg{opacity:0;transition:opacity .15s}
.done .box,.checking .box{background:var(--accent);border-color:var(--accent)}
.done .box svg,.checking .box svg{opacity:1}
.item.unchecking .box{background:none;border-color:var(--muted)}
.item.unchecking .box svg{opacity:0}
.name{flex:1;min-width:0;padding:11px 8px 11px 2px;overflow-wrap:anywhere;cursor:text}
.done .name,.checking .name{color:var(--muted)}
.done .name{text-decoration:line-through;text-decoration-color:var(--faint)}
.tags{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:46%;padding-right:4px}
.tag{font:700 11px/1 var(--f-ui);letter-spacing:.02em;color:var(--c);padding:4px 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 13%,transparent)}
.tag.once{color:var(--muted);background:none;box-shadow:inset 0 0 0 1px var(--line)}
.done .tag{opacity:.65}
.done-t{display:flex;align-items:center;gap:6px;height:36px;margin-left:30px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--muted);font:13.5px var(--f-ui)}
.done-t .chev{display:grid;transition:transform .15s;transform:rotate(-90deg)}
.done-t.open .chev{transform:none}

.kebab{width:34px;height:40px;color:var(--faint)}
.item.has-opts{background:var(--surface);border-radius:10px 10px 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;padding:4px 12px 12px 36px;border-radius:0 0 12px 12px;background:var(--surface)}
.line-form{flex:1;min-width:0;display:flex;margin:0 8px 0 2px}
.line-in{flex:1;min-width:0;height:38px;padding:0;border:0;border-bottom:2px solid var(--accent);border-radius:0;background:none;color:var(--ink);font:16px var(--f-ui);outline:0}
.line-in::placeholder{color:var(--faint)}
.line-row.new .box{border-style:dashed;border-color:var(--faint)}
.line-row.new .grip{visibility:hidden}
.addline{display:flex;align-items:center;width:100%;height:40px;padding:0;border:0;border-radius:10px;background:none;color:var(--faint);font:15px var(--f-ui);text-align:left}
.addline .al-ic{display:grid;place-items:center;width:38px;margin-left:28px}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.where .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.sopt{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);font:700 13px var(--f-ui)}
.sopt .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.sopt.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--on-chip)}
.sopt.on .dot{background:currentColor}
.edit-row{display:flex;align-items:center;justify-content:space-between;gap:8px}

.ghost{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border-radius:10px;box-shadow:var(--shadow)}
.ghost .cat-h{position:static;background:none;padding-right:8px}
.src{display:none!important}
.ph{flex:none;border-radius:10px;background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cat.drop>.cat-h{background:var(--accent-soft);border-radius:10px}
body.dragging,body.dragging *{cursor:grabbing!important}
.sorting .cat-b,.sorting .tips,.sorting .add-cat{display:none}
.sorting .cat-h{position:static}

.add-cat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:10px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font:700 14px var(--f-ui)}
.tips{margin:10px 0 4px;padding:8px 6px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:13.5px;line-height:1.35}
.tips-h{display:flex;align-items:center;gap:8px}
.tips-h b{font:700 15px var(--f-head)}
.tips-sub{flex:1;color:var(--muted);font-size:12.5px}
.tips ul{margin:2px 0 0;padding-left:18px;display:grid;gap:3px}
.tips-f{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.empty-h{margin:0 0 6px;font:700 18px var(--f-head);color:var(--ink)}
.empty p{margin:0 auto 14px;max-width:34ch}

.res-h{padding:14px 6px 6px;font:700 11.5px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.res-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 8px;border:0;border-radius:12px;background:none;color:var(--ink);text-align:left;font:15px var(--f-ui)}
.res-row:active{background:var(--surface)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rname{overflow-wrap:anywhere}
.rmeta{font-size:12.5px;color:var(--muted)}
.ract{flex:none;font:700 13px var(--f-ui);color:var(--accent)}
.rdot{flex:none;display:grid;place-items:center;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;color:var(--surface)}
.rdot.d{background:var(--faint);border-color:var(--faint)}
.plus{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.plus.alt{background:none;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
kbd{flex:none;font:11px var(--f-ui);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
@media (pointer:coarse){kbd{display:none}}
.recent{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.catpick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 8px 4px 40px}
.catpick>span{font-size:12.5px;color:var(--muted);margin-right:2px}
.res-tip{margin:16px 8px 0;max-width:46ch;color:var(--muted);font-size:13.5px;line-height:1.45}
.res-flash{display:flex;align-items:center;gap:8px;margin:6px 0 2px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.res-flash svg{flex:none;color:var(--accent)}
.res-flash span{flex:1;min-width:0}
.link{flex:none;border:0;background:none;padding:6px 6px;color:var(--accent);font:700 14px var(--f-ui)}
mark{background:var(--mark);color:inherit;border-radius:3px}

.menu{position:absolute;top:60px;right:0;z-index:30;width:min(300px,100%);padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.m-sync{display:flex;align-items:flex-start;gap:8px;margin:6px 8px 8px;color:var(--muted);font-size:12.5px;line-height:1.35}
.sdot{flex:none;width:8px;height:8px;margin-top:4px;border-radius:50%;background:var(--faint)}
.sdot.account{background:var(--accent)}
.m-item{display:block;width:100%;height:42px;padding:0 10px;border:0;border-radius:9px;background:none;text-align:left;font:15px var(--f-ui);color:var(--ink)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:vertical}
.m-p{margin:6px 6px 8px;font-size:13.5px;color:var(--muted)}
.m-row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.m-err{margin:8px 6px 2px;color:var(--danger);font-size:13px}

.snack{position:absolute;left:50%;bottom:16px;z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;padding:8px 8px 8px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:14px}
.snack span{padding-block:4px}
.snack button{flex:none;border:0;background:none;padding:6px 8px;color:var(--snack-act);font:700 14px var(--f-ui)}

@media (hover:hover){
  .icon-btn:hover{background:var(--line);color:var(--ink)}
  .res-row:hover{background:var(--surface)}
  .m-item:hover{background:var(--bg)}
  .item:not(.line-row):not(.has-opts):hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
}
@keyframes flash{0%,35%{background:var(--mark)}100%{background:transparent}}
.item.flash{animation:flash 1.6s ease-out}
@keyframes slide-l{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slide-r{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.slide-l{animation:slide-l .18s ease-out}
.slide-r{animation:slide-r .18s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="top">
    <div class="bar">
      <form class="omni" id="omni" role="search">
        <span class="omni-ic"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.6-3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <input id="q" type="text" placeholder="Add or find an item" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="enter" aria-label="Add or find an item">
        <button id="qclear" class="icon-btn" type="button" aria-label="Clear search" hidden></button>
      </form>
      <button id="viewBtn" class="icon-btn lg" type="button"></button>
      <button id="menuBtn" class="icon-btn lg" type="button" aria-label="More options" aria-haspopup="true"></button>
    </div>
    <nav id="stores" class="chips" aria-label="Stores"></nav>
    <div id="storebar" class="storebar" hidden></div>
    <div id="tabrow" class="tabrow" hidden>
      <div id="seg" class="seg" role="group" aria-label="Tabs show"><button type="button" data-by="cat">Category</button><button type="button" data-by="where">Store</button></div>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Tabs"></nav>
    </div>
  </header>
  <div class="stage">
    <main id="list" aria-label="Grocery list"></main>
    <div id="results" aria-label="Search results" hidden></div>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="snack" class="snack" role="status" aria-live="polite" hidden></div>
</div>

<script>
(() => {
'use strict';
const LS = 'aisle.state.v1', LSUI = 'aisle.ui.v1';
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const topEl = $('top'), listEl = $('list'), resultsEl = $('results'), storesEl = $('stores'), storebarEl = $('storebar'),
      tabsEl = $('tabs'), tabrowEl = $('tabrow'), segEl = $('seg'), q = $('q'), qclear = $('qclear'), menuEl = $('menu'), snackEl = $('snack'),
      viewBtn = $('viewBtn'), menuBtn = $('menuBtn');

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

const I = {
  grip: '<svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><g fill="currentColor"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/><circle cx="8" cy="14" r="1.6"/></g></svg>',
  tick: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.4 4.8 9 10 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',

const BOX = '<span class="box">' + I.tick + '</span>';

/* ---------- data ---------- */
function sample() {
  const now = Date.now(), H = 3600e3;
  const stores = [{id:'costco', name:'Costco', color:0}, {id:'aldi', name:'Aldi', color:1}, {id:'walmart', name:'Walmart', color:2}];
  const spec = [
    ['Produce', ['Bananas', 'Avocados|costco aldi', 'Baby spinach', 'Lemons', 'Cilantro', '-Strawberries|costco', '-Garlic', '-Yellow onions', '-Sweet potatoes|aldi']],
    ['Dairy & eggs', ['Eggs, 24 pack|costco', 'Greek yogurt|aldi', 'Oat milk', '-Butter', '-Shredded mozzarella|aldi', '-Sharp cheddar']],
    ['Meat & fish', ['Chicken thighs|costco', 'Ground turkey|aldi', '-Salmon fillets|costco', '-Bacon']],
    ['Bakery', ['Sourdough loaf', '!Birthday candles|walmart', '-Tortillas|walmart', '-Bagels']],
    ['Pantry', ['Olive oil|costco', 'Pasta|aldi', 'Peanut butter', 'Coffee beans|costco', '!Saffron (paella night)', '-Jasmine rice|costco', '-Canned tomatoes', '-Black beans', '-Maple syrup|costco']],
    ['Frozen', ['Frozen berries|costco', '-Frozen peas', '-Ice cream']],
    ['Household', ['Paper towels|costco', 'Dish soap|walmart', '-Trash bags|costco walmart', '-Light bulbs|walmart', '-Laundry pods|costco']],
    ['Snacks', ['Tortilla chips|aldi', 'Dark chocolate|aldi', '-Almonds|costco']]
  ];
  const cats = [], items = [];
  let k = 0;
  for (const [cname, rows] of spec) {
    const c = {id: uid(), name: cname};
    cats.push(c);
    for (let s of rows) {
      const done = s[0] === '-', once = s[0] === '!';
      if (done || once) s = s.slice(1);
      const [name, st] = s.split('|');
      k++;
      items.push({id: uid(), name, cat: c.id, stores: st ? st.split(' ') : [], once, done, doneAt: done ? now - k * 5 * H : 0, addedAt: now - 30 * 24 * H});
    }
  }
  return {v: 1, savedAt: 0, sample: true, stores, cats, items};
}

function clean(s) {
  if (!s || !Array.isArray(s.items) || !Array.isArray(s.cats)) throw new Error('Not a list backup');
  const stores = (Array.isArray(s.stores) ? s.stores : []).filter(x => x && x.id && x.name)
    .map((x, i) => ({id: String(x.id), name: String(x.name), color: Number.isInteger(x.color) ? Math.abs(x.color) % 6 : i % 6}));
  const cats = s.cats.filter(c => c && c.id).map(c => ({id: String(c.id), name: String(c.name || 'Untitled')}));
  const cids = new Set(cats.map(c => c.id)), sids = new Set(stores.map(x => x.id));
  const items = s.items.filter(i => i && i.id && i.name && cids.has(String(i.cat))).map(i => ({
    id: String(i.id), name: String(i.name), cat: String(i.cat),
    stores: (Array.isArray(i.stores) ? i.stores : []).map(String).filter(x => sids.has(x)),
    once: !!i.once, done: !!i.done, doneAt: +i.doneAt || 0, addedAt: +i.addedAt || 0
  }));
  return {v: 1, savedAt: +s.savedAt || 0, sample: !!s.sample, stores, cats, items};
}

const UI0 = {view: 'list', tabsBy: 'cat', store: 'all', only: false, tab: null, wtab: 'any', collapsed: {}, openDone: {}, lastCat: null, hint: true};
function loadState() { try { const r = localStorage.getItem(LS); if (r) return clean(JSON.parse(r)); } catch (e) {} return null; }
function loadUI() { try { const r = localStorage.getItem(LSUI); if (r) return Object.assign({}, UI0, JSON.parse(r)); } catch (e) {} return Object.assign({}, UI0); }
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function saveUI() {
  try {
    const {view, tabsBy, store, only, tab, wtab, collapsed, openDone, lastCat, hint} = ui;
    localStorage.setItem(LSUI, JSON.stringify({view, tabsBy, store, only, tab, wtab, collapsed, openDone, lastCat, hint}));
  } catch (e) {}
}

let state = loadState() || sample();
let ui = loadUI();
let flash = null, slideDir = 0, snackT = 0, swallowClick = false, menuMode = 'main';
let press = null, drag = null, sw = null;

const item = id => state.items.find(i => i.id === id);
const cat = id => state.cats.find(c => c.id === id);
const store = id => state.stores.find(s => s.id === id);
const snapshot = () => JSON.stringify(state);
function restore(snap) { state = clean(JSON.parse(snap)); commit(); }

function visibleIn(i, s, only) { return s === 'all' || i.stores.includes(s) || (!only && i.stores.length === 0); }
const visible = i => visibleIn(i, ui.store, ui.only);
const needIn = cid => state.items.filter(i => i.cat === cid && !i.done && visible(i)).length;
function visibleCats() {
  return state.cats.filter(c => ui.store === 'all' || ui.renaming === c.id || state.items.some(i => i.cat === c.id && visible(i)));
}
// "Store" tabs: Anywhere, one per store (items marked for it), and One-offs.
function groups() {
  return [{id: 'any', name: 'Anywhere'}].concat(state.stores.map(s => ({id: s.id, name: s.name, color: s.color})), [{id: 'once', name: 'One-offs'}]);
}
function inGroup(i, g) { return g === 'once' ? i.once : !i.once && (g === 'any' ? i.stores.length === 0 : i.stores.includes(g)); }
function visibleGroups() { return groups().filter(g => ui.store === 'all' || state.items.some(i => inGroup(i, g.id) && visible(i))); }
const byWhere = () => ui.view === 'tabs' && ui.tabsBy === 'where';
function groupOf(it) { return it.once ? 'once' : it.stores.length ? (it.stores.includes(ui.store) ? ui.store : it.stores[0]) : 'any'; }
function sortStores(ids) { const set = new Set(ids); return state.stores.map(s => s.id).filter(id => set.has(id)); }

/* ---------- saving: this browser + (when available) the viewer's private Claude storage ---------- */
let remote = null, syncMode = 'local', syncErr = '', pending = false, wTimer = 0, retries = 0, wChain = Promise.resolve();
function commit() { state.savedAt = Date.now(); saveLocal(); pushRemote(); render(); }
function persist() { state.savedAt = Date.now(); saveLocal(); pushRemote(); }
function pushRemote() {
  if (!remote) return;
  pending = true;
  clearTimeout(wTimer);
  wTimer = setTimeout(flushRemote, 600);
}
function flushRemote() {
  if (!remote || !pending) return;
  clearTimeout(wTimer); wTimer = 0;
  const body = JSON.parse(JSON.stringify(state));
  wChain = wChain.then(() => remote.set(body)).then(() => { pending = false; syncErr = ''; retries = 0; }, e => {
    pending = false;
    syncErr = (e && e.code) || 'error';
    if ((syncErr === 'unavailable' || syncErr === 'resource_exhausted') && retries++ < 2) setTimeout(pushRemote, 2000 + Math.random() * 2000);
    if (!menuEl.hidden && menuMode === 'main') renderMenu();
  });
}
function adoptRemote(d) {
  if (!d || (+d.savedAt || 0) <= (state.savedAt || 0)) return;
  try {
    const s = clean(JSON.parse(JSON.stringify(d)));
    ui.line = null; ui.opts = null; ui.renaming = null; ui.editStore = false;
    state = s; saveLocal(); render();
  } catch (e) {}
}
async function initRemote() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  let db, user, id, ref;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  try { id = await user.id(); } catch (e) { return; }
  if (!id) return;
  try { ref = db.doc('data/users/' + id + '/state'); } catch (e) { return; }
  try {
    const snap = await ref.get();
    remote = ref; syncMode = 'account';
    if (snap.exists) adoptRemote(snap.data());
    else if (state.savedAt) pushRemote();
  } catch (e) { remote = null; syncMode = 'local'; }
  if (!menuEl.hidden && menuMode === 'main') renderMenu();
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { flushRemote(); return; }
  if (!remote || pending || drag || ui.line || ui.opts || ui.renaming) return;
  try { const snap = await remote.get(); if (snap.exists) adoptRemote(snap.data()); } catch (e) {}
});

/* ---------- rendering ---------- */
function render() {
  if (ui.store !== 'all' && !store(ui.store)) { ui.store = 'all'; ui.only = false; }
  if (byWhere()) {
    const vg = visibleGroups();
    if (!vg.some(g => g.id === ui.wtab)) ui.wtab = vg[0] ? vg[0].id : 'any';
  } else if (ui.view === 'tabs') {
    const vc = visibleCats();
    if (!vc.some(c => c.id === ui.tab)) ui.tab = vc[0] ? vc[0].id : null;
  }
  renderTop();
  renderList();
  if (!resultsEl.hidden) renderResults();
  if (!menuEl.hidden && menuMode === 'main') renderMenu();
  saveUI();
}

function renderTop() {
  const allN = state.items.filter(i => !i.done).length;
  let h = `<button class="chip${ui.store === 'all' ? ' on' : ''}" data-store="all" aria-pressed="${ui.store === 'all'}">All <span class="n">${allN}</span></button>`;
  for (const s of state.stores) {
    const n = state.items.filter(i => !i.done && visibleIn(i, s.id, false)).length;
    h += `<button class="chip${ui.store === s.id ? ' on' : ''}" data-store="${s.id}" aria-pressed="${ui.store === s.id}" style="--c:var(--st${s.color})"><i class="dot"></i>${esc(s.name)} <span class="n">${n}</span></button>`;
  }
  h += ui.addingStore
    ? `<input id="newStore" class="chip chip-in" placeholder="Store name" aria-label="New store name" enterkeyhint="done" autocomplete="off">`
    : `<button class="chip add" data-store-add aria-label="Add a store">${I.plus}Store</button>`;
  storesEl.innerHTML = h;

  if (ui.store === 'all') { storebarEl.hidden = true; storebarEl.innerHTML = ''; }
  else {
    const s = store(ui.store);
    storebarEl.hidden = false;
    storebarEl.style.setProperty('--c', `var(--st${s.color})`);
    storebarEl.innerHTML = ui.editStore
      ? `<input id="storeName" class="sb-input" value="${esc(s.name)}" aria-label="Store name" enterkeyhint="done" autocomplete="off"><button class="btn" data-sb="save">Done</button><button class="btn danger" data-sb="delete">Delete</button>`
      : `<button class="sb-toggle" data-sb="only" role="switch" aria-checked="${!!ui.only}"><span class="switch"><span class="knob"></span></span><span>Hide items I can buy anywhere</span></button><button class="icon-btn sm" data-sb="edit" aria-label="Rename or delete ${esc(s.name)}" title="Rename or delete store">${I.pencil}</button>`;
  }

  const tabs = ui.view === 'tabs';
  tabrowEl.hidden = !tabs;
  topEl.classList.toggle('has-tabs', tabs);
  if (tabs) {
    segEl.querySelectorAll('button').forEach(b => { const on = b.dataset.by === ui.tabsBy; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  }
  if (tabs && ui.tabsBy === 'where') {
    tabsEl.innerHTML = visibleGroups().map(g => {
      const n = state.items.filter(i => !i.done && visible(i) && inGroup(i, g.id)).length, on = g.id === ui.wtab, st = g.color != null;
      return `<button class="tab${on ? ' on' : ''}" data-wtab="${g.id}" role="tab" aria-selected="${on}"${st ? ` style="--c:var(--st${g.color})"` : ''}>${st ? '<i class="dot"></i>' : ''}${esc(g.name)}<span class="n">${n || ''}</span></button>`;
    }).join('');
  } else if (tabs) {
    tabsEl.innerHTML = visibleCats().map(c => {
      const n = needIn(c.id);
      return `<button class="tab${c.id === ui.tab ? ' on' : ''}" data-tab="${c.id}" role="tab" aria-selected="${c.id === ui.tab}">${esc(c.name)}<span class="n">${n || ''}</span></button>`;
    }).join('') + (ui.store === 'all' ? `<button class="tab" data-tabadd aria-label="New category" title="New category">${I.plus}</button>` : '');
  }
  if (tabs) {
    const on = tabsEl.querySelector('.on');
    if (on) {
      const l = on.offsetLeft, r = l + on.offsetWidth;
      if (l < tabsEl.scrollLeft + 10) tabsEl.scrollLeft = l - 24;
      else if (r > tabsEl.scrollLeft + tabsEl.clientWidth - 10) tabsEl.scrollLeft = r - tabsEl.clientWidth + 24;
    }
  }
  viewBtn.innerHTML = tabs ? I.list : I.tabs;
  const vl = tabs ? 'Show everything in one list' : 'Show as tabs';
  viewBtn.setAttribute('aria-label', vl); viewBtn.title = vl;
}

const tidy = v => String(v).replace(/\s+/g, ' ').trim();
function rowHTML(it) {
  const here = byWhere() ? ui.wtab : ui.store;
  const tags = it.stores.filter(s => s !== ui.store && s !== here).map(store).filter(Boolean)
    .map(s => `<span class="tag" style="--c:var(--st${s.color})">${esc(s.name)}</span>`).join('') +
    (it.once && here !== 'once' ? '<span class="tag once">One-off</span>' : '');
  const check = `<button class="check" data-act="check" role="checkbox" aria-checked="${it.done}" aria-label="${it.done ? 'Put back on list' : 'Check off'}: ${esc(it.name)}">${BOX}</button>`;
  const grip = `<span class="grip" data-grip="item" aria-hidden="true">${I.grip}</span>`;
  const kebab = `<button class="icon-btn kebab" data-act="opts" aria-label="Options for ${esc(it.name)}" aria-expanded="${ui.opts === it.id}" title="Stores, one-off, move, delete">${I.dots}</button>`;
  if (ui.line && ui.line.mode === 'edit' && ui.line.id === it.id) {
    return `<div class="item line-row${it.done ? ' done' : ''}" data-id="${it.id}">${grip}${check}<form class="line-form" data-lineform><input class="line-in" id="line-in" value="${esc(it.name)}" aria-label="Item name" enterkeyhint="${it.done ? 'done' : 'next'}" autocomplete="off" autocapitalize="sentences"></form>${kebab}</div>`;
  }
  return `<div class="item${it.done ? ' done' : ''}${ui.opts === it.id ? ' has-opts' : ''}" data-id="${it.id}">${grip}${check}<span class="name" data-act="edit">${esc(it.name)}</span>${tags ? `<span class="tags">${tags}</span>` : ''}${kebab}</div>`;

function optsHTML(it) {

function itemHTML(it) { return rowHTML(it) + (ui.opts === it.id ? optsHTML(it) : ''); }
function lineHTML(c) {

// mode: 'list' (full list), 'solo' (one category tab), 'sub' (a category inside a store tab)
function catHTML(c, mode, extra) {
  const ok = i => i.cat === c.id && visible(i) && (!extra || extra(i));
  const solo = mode !== 'list';
  const need = state.items.filter(i => ok(i) && !i.done);
  const done = state.items.filter(i => ok(i) && i.done).sort((a, b) => b.doneAt - a.doneAt);
  const folded = !solo && !!ui.collapsed[c.id];
  const openDone = !!ui.openDone[c.id];
  const renaming = ui.renaming === c.id;
  // The writing line sits right after the item it follows, or at the end.
  const writing = !!(ui.line && ui.line.mode === 'new' && ui.line.cat === c.id);
  let needHTML = '', placed = false;
  for (const it of need) {
    needHTML += itemHTML(it);
    if (writing && ui.line.after === it.id) { needHTML += lineHTML(c); placed = true; }
  }
  if (writing && !placed) needHTML += lineHTML(c);
  const head = renaming
    ? `<input class="cname-in" id="rename-${c.id}" value="${esc(c.name)}" aria-label="Category name" enterkeyhint="done" autocomplete="off"><button class="icon-btn danger" data-act="del-cat" aria-label="Delete ${esc(c.name)}" title="Delete category">${I.trash}</button><button class="btn primary" data-act="rename-done">Done</button>`
    : `<button class="cname" data-act="rename" title="Rename">${esc(c.name)}</button>${need.length ? `<span class="count">${need.length}</span>` : ''}<span class="sp"></span>` +
      (solo ? '' : `<button class="icon-btn" data-act="focus" aria-label="Open ${esc(c.name)} as a tab" title="Focus on this category">${I.focus}</button><button class="icon-btn fold" data-act="fold" aria-expanded="${!folded}" aria-label="${folded ? 'Expand' : 'Collapse'} ${esc(c.name)}">${I.chev}</button>`);
  return `<section class="cat${folded ? ' folded' : ''}${mode === 'solo' ? ' solo' : ''}" data-cat="${c.id}">
    <div class="cat-h${renaming ? ' renaming' : ''}">${solo ? '' : `<span class="grip" data-grip="cat" aria-hidden="true">${I.grip}</span>`}${head}</div>
    <div class="cat-b">
      <div class="items" data-zone="need" data-cat="${c.id}">${needHTML}</div>
      ${writing ? '' : `<button class="addline" data-act="add-line"><span class="al-ic">${I.plus}</span>Add item</button>`}
      ${done.length ? `<button class="done-t${openDone ? ' open' : ''}" data-act="done" aria-expanded="${openDone}">${I.tick} ${done.length} checked off <span class="chev">${I.chev}</span></button>
      <div class="items" data-zone="done" data-cat="${c.id}"${openDone ? '' : ' hidden'}>${done.map(itemHTML).join('')}</div>` : ''}
    </div></section>`;
}

function groupEmptyHTML(g) {
  const s = store(g);

}

listEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.opts button, .cat-h.renaming button')) { e.preventDefault(); return; }
  if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0) || drag) return;
  // Closing an open editor re-renders the list, so find what is under the finger now.
  const t = e.target.isConnected ? e.target : document.elementFromPoint(e.clientX, e.clientY);
  if (!t || !listEl.contains(t)) return;
  if (ui.view === 'tabs' && e.pointerType !== 'mouse') sw = {x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId};
  const grip = t.closest('[data-grip]');
  if (grip) {
    e.preventDefault();
    sw = null;
    if (grip.dataset.grip === 'item') { const row = grip.closest('.item'); if (row && row.dataset.id) startItemDrag(row, e.clientX, e.clientY, e.pointerId); }
    else startCatDrag(grip.closest('.cat'), e.clientX, e.clientY, e.pointerId);
    return;
  }
  const row = t.closest('.item');
  if (!row || !row.dataset.id || row.classList.contains('line-row') || t.closest('button, input')) return;
  press = {row, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, id: e.pointerId, mouse: e.pointerType === 'mouse', t: 0};
  if (!press.mouse) press.t = setTimeout(() => {
    const p = press; press = null;
    if (p) { sw = null; startItemDrag(p.row, p.lx, p.ly, p.id); }
  }, 380);
});
window.addEventListener('pointermove', e => {
  if (press && e.pointerId === press.id) {
    press.lx = e.clientX; press.ly = e.clientY;
    const d = Math.hypot(e.clientX - press.x, e.clientY - press.y);
    if (press.mouse && d > 5) { const p = press; press = null; startItemDrag(p.row, e.clientX, e.clientY, p.id); }
    else if (!press.mouse && d > 9) { clearTimeout(press.t); press = null; }
  }
  if (drag && e.pointerId === drag.pid) moveDrag(e.clientX, e.clientY);
}, {passive: true});
function pointerDone(e, cancelled) {
  if (press && e.pointerId === press.id) { clearTimeout(press.t); press = null; }
  const wasDrag = !!drag;
  if (drag && e.pointerId === drag.pid) endDrag();
  if (!cancelled && !wasDrag && sw && sw.id === e.pointerId) {
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.8 * Math.abs(dy) && Date.now() - sw.t < 700) {
      swallowClick = true;
      switchTab(dx < 0 ? 1 : -1);
    }
  }
  sw = null;
}
window.addEventListener('pointerup', e => pointerDone(e, false));
window.addEventListener('pointercancel', e => pointerDone(e, true));
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive: false});

/* ---------- start ---------- */
render();
initRemote();
})();
</script>
